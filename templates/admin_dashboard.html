<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            
            <div style="width: 90px;" class="d-none d-md-block"></div>

                <h2 class="m-0" style="color: burlywood; font-family: 'Times New Roman', Times, serif;">
                    Welcome Admin 
                </h2>

           
                <a href="/logout" class="btn btn-danger btn-sm">Log Out</a>
             
        </div>
        

        
        <div class="row g-3">
            <div class="col-md-3">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="text-muted small text-uppercase">Total Users</h5>
                        <h2 class="display-6 fw-bold m-0">{{ total_users }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="text-muted small text-uppercase">Total Treks</h5>
                        <h2 class="display-6 fw-bold m-0">{{ total_treks }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="text-muted small text-uppercase">Total Staff</h5>
                        <h2 class="display-6 fw-bold m-0">{{ total_staff }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="text-muted small text-uppercase">Total Bookings</h5>
                        <h2 class="display-6 fw-bold m-0">{{ total_bookings }}</h2>
                    </div>
                </div>
            </div>
        </div>

       
        <div class="row g-3  mt-4">
            <div class="col-md-4">
                <a href="/create_trek" class="btn btn-primary w-100 py-2 fw-semibold">➕ Create Trek</a>
            </div>
            <div class="col-md-4">
                <a href="/view_treks" class="btn btn-success w-100 py-2 fw-semibold">🥾 View Treks</a>
            </div>
            <div class="col-md-4">
                <a href="/pending_staff" class="btn btn-warning w-100 py-2 fw-semibold">👨‍💼 Pending Staff</a>
            </div>
            <div class="col-md-4">
                <a href="/view_users" class="btn btn-info w-100 py-2 fw-semibold">👥 View Users</a>
            </div>
            <div class="col-md-4">
                <a href="/view_bookings" class="btn btn-secondary w-100 py-2 fw-semibold">📖 View Bookings</a>
            </div>
            <div class="col-md-4">
                <a href="/view_staff" class="btn btn-info w-100 py-2 fw-semibold">👨‍💼 View Staff</a>
            </div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
