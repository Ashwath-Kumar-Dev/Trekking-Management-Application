<!DOCTYPE html>
<html>
<head>

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center">Admin Dashboard</h2>

        <div class="row mt-4">

        <div class="col-md-3">

        <div class="card text-center">

        <div class="card-body">

            <h5>Total Users</h5>

            <h2>{{ total_users }}</h2>

        </div>

        </div>

        </div>

        <div class="col-md-3">

        <div class="card text-center">

        <div class="card-body">

            <h5>Total Treks</h5>

            <h2>{{ total_treks }}</h2>

        </div>

        </div>

        </div>

        <div class="col-md-3">

        <div class="card text-center">

        <div class="card-body">

            <h5>Total Staff</h5>

            <h2>{{ total_staff }}</h2>

        </div>

        </div>

        </div>

        <div class="col-md-3">

        <div class="card text-center">

        <div class="card-body">

            <h5>Total Bookings</h5>

            <h2>{{ total_bookings }}</h2>

        </div>

        </div>

        </div>

        </div>

</div>

<div class="row mt-5">
    <div class="col-md-4 mb-3">
        <a href="/create_trek" class="btn btn-primary w-100">
            ➕ Create Trek
        </a>
    </div>

    <div class="col-md-4 mb-3">
        <a href="/view_treks" class="btn btn-success w-100">
            🥾 View Treks
        </a>
    </div>

    <div class="col-md-4 mb-3">
        <a href="/pending_staff" class="btn btn-warning w-100">
            👨‍💼 Pending Staff
        </a>
    </div>

    <div class="col-md-4 mb-3">
        <a href="/view_users" class="btn btn-info w-100">
            👥 View Users
        </a>
    </div>

    <div class="col-md-4 mb-3">
        <a href="/view_bookings" class="btn btn-secondary w-100">
            📖 View Bookings
        </a>
    </div>

    <div class="col-md-4 mb-3">
        <a href="/logout" class="btn btn-danger w-100">
            🚪 Logout
        </a>
    </div>

</div>
</body>
</html>
