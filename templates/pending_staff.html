<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Pending Staff</title>
</head>
<body>
    <div class="container mt-5 position-relative">
        
        <a href="/admin_dashboard" class="btn btn-primary position-absolute top-0 end-0">
            🏠 Admin Dashboard
        </a>

        
        <div class="pt-5">
             <h2 class= "text-center", style="color: saddlebrown; font-family: 'Times New Roman', Times, serif;">Pending Staff Applications</h2>
             <table class="table table-bordered table-hover table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Staff ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Contact</th>
                        <th>Experience</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {%for staff in pending%}
                    <tr>
                        <td>{{ staff.id }}</td>
                        <td>{{ staff.user.username }}</td>
                        <td>{{ staff.user.email }}</td>
                        <td>{{ staff.contact }}</td>
                        <td>{{ staff.experience }}</td>
                        <td>
                            <a href="/approve_staff/{{ staff.id }}" class="btn btn-success btn-sm">Approve</a>
                            <a href="/reject_staff/{{ staff.id }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to reject this staff application?')";>Reject</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
             </table>
        </div>
    </div>
</body>
</html>
