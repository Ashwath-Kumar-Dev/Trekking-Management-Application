<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Trek</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-warning text-dark text-center">

                    <h3 class="mb-0">
                        ✏️ Edit Trek
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        
                        <div class="mb-3">

                            <label class="form-label">
                                Trek Name
                            </label>

                            <input
                                type="text"
                                name="trek_name"
                                value="{{ trek.trek_name }}"
                                class="form-control"
                                required>

                        </div>


                        
                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                value="{{ trek.location }}"
                                class="form-control"
                                required>

                        </div>


                        
                        <div class="mb-3">

                            <label class="form-label">
                                Difficulty
                            </label>

                            <select
                                name="difficulty"
                                class="form-select"
                                required>

                                <option value="Easy"
                                    {% if trek.difficulty == "Easy" %}selected{% endif %}>
                                    Easy
                                </option>

                                <option value="Medium"
                                    {% if trek.difficulty == "Medium" %}selected{% endif %}>
                                    Medium
                                </option>

                                <option value="Hard"
                                    {% if trek.difficulty == "Hard" %}selected{% endif %}>
                                    Hard
                                </option>

                            </select>

                        </div>


                        
                        <div class="mb-3">

                            <label class="form-label">
                                Duration (Days)
                            </label>

                            <input
                                type="number"
                                name="duration"
                                value="{{ trek.duration }}"
                                class="form-control"
                                min="1"
                                required>

                        </div>


                       
                        <div class="mb-3">

                            <label class="form-label">
                                Available Slots
                            </label>

                            <input
                                type="number"
                                name="available_slots"
                                value="{{ trek.available_slots }}"
                                class="form-control"
                                min="0"
                                required>

                        </div>


                   
                        <div class="mb-3">

                            <label class="form-label">
                                Start Date
                            </label>

                            <input
                                type="date"
                                name="start_date"
                                value="{{ trek.start_date }}"
                                class="form-control"
                                required>

                        </div>


                   
                        <div class="mb-3">

                            <label class="form-label">
                                End Date
                            </label>

                            <input
                                type="date"
                                name="end_date"
                                value="{{ trek.end_date }}"
                                class="form-control"
                                required>

                        </div>


                        
                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-warning flex-fill">
                                💾 Save Changes
                            </button>

                            <a
                                href="/view_treks"
                                class="btn btn-secondary flex-fill">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
