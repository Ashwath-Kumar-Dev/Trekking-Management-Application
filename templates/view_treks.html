<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Treks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
    <h2>All Treks</h2>

    <form method="GET" action="/view_treks" class="mb-3">

        <div class="input-group">

            <input
                type="text"
                name="search"
                class="form-control"
                value="{{ request.args.get('search','') }}"
                placeholder="Search trek by name or location">

            <button
                class="btn btn-primary"
                type="submit">

                 Search

           </button>

        </div>

        </form>

    <table class="table table-bordered table-hover table-striper">
        <thead class="table-dark">
        <tr>
            <th>Trek Id</th>
            <th>Trek Name</th>
            <th>Location</th>
            <th>Diffculty</th>
            <th>Duration</th>
            <th>Available Slots</th>
            <th>Status</th>
            
            <th>Actions</th>
        </tr>
        </thead>
        {%for trek in treks %}
        <tr>
            <td>{{ trek.id }}</td>
            <td>{{ trek.trek_name }}</td>
            <td>{{ trek.location }}</td>
            <td>{{ trek.difficulty }}</td>
            <td>{{ trek.duration }}</td>
            <td>{{ trek.available_slots }}</td>
            <td>{{ trek.status }}</td>
            
            <td>
                <a href="/edit_trek/{{ trek.id }}" class="btn btn-warning btn-sm">Edit</a>
                <a href="/delete_trek/{{ trek.id }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this trek?')">Delete</a>
                <a href="/assign_staff/{{ trek.id }}"
                class="btn btn-primary btn-sm">
                Assign Staff
                </a>
            </td>
            
        </tr>
        {%endfor%}
    </table>
    </div>
</body>
</html>
