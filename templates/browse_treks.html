<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Treks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
<div class="container mt-5">
        <h2 class= "text-center", style="color: burlywood; font-family: 'Times New Roman', Times, serif; ">Welcome {{ user.username }}</h2><br>
        <h3>Browse The Treks </h3>

        <table class="table table-bordered table-striped table-hover">

        <thead class="table-dark">

            <tr>

                <th>Trek Name</th>

                <th>Location</th>

                <th>Difficulty</th>

                <th>Duration</th>

                <th>Slots</th>

                <th>Book</th>

            </tr>

        </thead>

        <tbody>

            {% for trek in treks %}

            <tr>

                <td>{{ trek.trek_name }}</td>

                <td>{{ trek.location }}</td>

                <td>{{ trek.difficulty }}</td>

                <td>{{ trek.duration }}</td>

                <td>{{ trek.available_slots }}</td>

                <td>
                    <a href="/book_trek/{{ trek.id }}"class="btn btn-success btn-sm">
                        Book</a>
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>


</body>
</html>
