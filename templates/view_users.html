<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>
<body>
    <div class="container mt-5">
        <h2 class="text-centre">All Users</h2>

        <table class="table table-bordered table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>

                    <th>Username</th>

                    <th>Email</th>

                    <th>Role</th>

                    <th>Status</th>

                </tr>
            </thead>
            <tbody>
                {% for user in users %}

                <tr>

                    <td>{{ user.id }}</td>

                    <td>{{ user.username }}</td>

                    <td>{{ user.email }}</td>

                    <td>{{ user.role }}</td>

                    <td>{{ user.status }}</td>

                </tr>

                {% endfor %}

            </tbody>
        </table>

    </div>
    
</body>
</html>
