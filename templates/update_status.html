<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Trek Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
    <div class="container mt-5 position-relative">
    
    <a href="/staff_dashboard" class="btn btn-primary position-absolute top-0 end-0">
        🏠 Staff Dashboard
    </a>

    
    <div class="pt-5">
        <h2>Update Trek Status</h2>

        <h4>{{ trek.trek_name }}</h4>

        <form method="POST">

            <label>Status</label>

            <select
                name="status"
                class="form-select">

                <option value="Open">Open</option>

                <option value="Ongoing">Ongoing</option>

                <option value="Completed">Completed</option>

            </select>

            <br>

            <button class="btn btn-success">

                Save Status

            </button>

        </form>
    </div>

</div>

    
</body>
</html>
