<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trekker Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
            
            <div style="width: 90px;" class="d-none d-md-block"></div>

                <h2 class="m-0" style="color: burlywood; font-family: 'Times New Roman', Times, serif;">
                    Welcome {{ user.username }}
                </h2>

           
                <a href="/logout" class="btn btn-danger btn-sm">Log Out</a>
             
    </div>
        

    <div class="row g-4 mb-5">

        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h4>My Bookings</h4>

                    <h2>{{ total_bookings }}</h2>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h4>Booked Treks</h4>

                    <h2>{{ booked_treks }}</h2>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h4>Completed Treks</h4>

                    <h2>{{ completed_treks }}</h2>

                </div>

            </div>

        </div>

    </div>


    <div class="row g-3">

        <div class="col-md-4">

            <a href="/browse_treks"
               class="btn btn-success w-100">

                🥾 Browse Treks

            </a>

        </div>


        <div class="col-md-4">

            <a href="/booking_history"
               class="btn btn-primary w-100">

                📋 My Booking History

            </a>

        </div>



        </div>

    </div>

</div>

</body>

</html>
